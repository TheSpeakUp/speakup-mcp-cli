name: publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run npm publish --dry-run only'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Self-hosted (2026-08-12): the org's Actions billing is blocked, so GitHub-
    # hosted jobs never start — they die 2-3s in with zero executed steps and the
    # annotation "The job was not started because recent account payments have
    # failed or your spending limit needs to be increased". Read that with
    #   gh api repos/TheSpeakUp/speakup-mcp-cli/check-runs/<job_id>/annotations --jq '.[].message'
    # before debugging a diff — the failure looks exactly like a code regression.
    #
    # `gha-gate` is the org `linux-ci-shared` runner pool. This repo had NO
    # self-hosted capacity of any kind until 2026-08-12, when it was added to that
    # pool's scope — a `runs-on` edit alone would not have worked before then.
    #
    # REVERT to `ubuntu-latest` once billing is restored.
    runs-on: [self-hosted, gha-gate, X64]
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${REF_NAME#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)" >&2
            exit 1
          fi

      - name: Publish (dry-run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true'
        run: npm publish --dry-run --access public

      - name: Publish
        if: |
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
