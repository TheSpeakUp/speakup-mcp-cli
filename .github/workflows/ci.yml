name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Self-hosted (2026-08-12): the org's Actions billing is blocked, so GitHub-
    # hosted jobs never start — they die 2-3s in with zero executed steps and the
    # annotation "The job was not started because recent account payments have
    # failed or your spending limit needs to be increased". Read that with
    #   gh api repos/TheSpeakUp/speakup-mcp-cli/check-runs/<job_id>/annotations --jq '.[].message'
    # before debugging a diff — the failure looks exactly like a code regression.
    #
    # `gha-gate` is the org `linux-ci-shared` runner pool. This repo had NO
    # self-hosted capacity of any kind until 2026-08-12, when it was added to that
    # pool's scope — a `runs-on` edit alone would not have worked before then.
    #
    # REVERT to `ubuntu-latest` once billing is restored.
    runs-on: [self-hosted, gha-gate, X64]
    strategy:
      fail-fast: false
      matrix:
        node: ['18.17', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint (typecheck + prettier)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Verify bin shebang + executable bit
        run: |
          head -1 dist/index.js | grep -q '^#!/usr/bin/env node'
          test -x dist/index.js
